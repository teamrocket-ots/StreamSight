[server]
# Streamlit's default is 200 MB. Free tiers typically cap out around 1 GB of
# RAM, and a capture that large would exhaust it during parsing, so the limit is
# lowered to fail fast at upload rather than OOM half way through a parse.
maxUploadSize = 50
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#4C8BF5"
